id: AdvancedTimeIsland
name: AdvancedTimeIsland
version: 2.0.5.2
apiVersion: 2.0.0.0
author: inf2147483647
description: 高级时间管理插件，增强ClassIsland时间功能
entranceAssembly: AdvancedTimeIsland.dll
icon: icon.png
url: https://github.com/inf2147483647/AdvancedTimeIsland
supportedOSPlatforms:
  - Windows
# SuperAutoIsland 为可选依赖：安装后本插件的行动/规则会注册为其 Blockly 积木；
# 未安装时插件功能不受影响。
# LibPinyin 同为可选依赖：安装后“女装 → JK 制服”页的插件归因走其 IPinyinService 做拼音匹配；
# 未安装时回退到内置的简易拼音匹配（见 CrossPluginHelper.SimplePinyinMatcher），功能不受影响。
dependencies:
  - id: lrs2187.sai
    isRequired: false
  - id: lrs2187.LibPinyin
    isRequired: false
