name: Build AdvancedTimeIsland

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: AdvancedTimeIsland.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # 保险：确保 nuget.config 中离线源目录存在（正常情况下由 packages/.gitkeep 保证）。
    # 目录存在但为空时，NuGet 自动回退到 nuget.org 在线还原。
    - name: Ensure offline packages dir exists
      shell: pwsh
      run: New-Item -ItemType Directory -Path packages -Force | Out-Null

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    - name: Build and package all 3 variants
      shell: pwsh
      run: |
        .\Build-Package.ps1 -Target both
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Upload net8.0 compat package
      uses: actions/upload-artifact@v4
      with:
        name: AdvancedTimeIsland-net8.0-compat.cipx
        path: cipx/AdvancedTimeIsland-net8.0-compat.cipx
        if-no-files-found: error

    - name: Upload net10.0 new package
      uses: actions/upload-artifact@v4
      with:
        name: AdvancedTimeIsland-net10.0.cipx
        path: cipx/AdvancedTimeIsland-net10.0.cipx
        if-no-files-found: error

    - name: Upload WPF package
      uses: actions/upload-artifact@v4
      with:
        name: AdvancedTimeIsland-wpf.cipx
        path: cipx/AdvancedTimeIsland-wpf.cipx
        if-no-files-found: error

    - name: Upload all packages (zip)
      uses: actions/upload-artifact@v4
      with:
        name: AdvancedTimeIsland-all-cipx
        path: cipx/*.cipx
        if-no-files-found: error
